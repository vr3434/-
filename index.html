<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Мото Галерея</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --accent-color: #ff4500;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: #0a0a0a;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            margin: 5px 0 0 0;
            color: #888;
        }

        .gallery-container {
            max-width: 1200px;
            width: 90%;
            margin: 40px 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #2a2a2a;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(255, 69, 0, 0.2);
            border-color: var(--accent-color);
        }

        .image-container {
            width: 100%;
            height: 220px;
            background-color: #2c2c2c;
            position: relative;
            overflow: hidden;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .image-container img {
            transform: scale(1.05);
        }

        .card-info {
            padding: 15px;
            text-align: center;
        }

        .card-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }

        footer {
            margin-top: auto;
            background-color: #0a0a0a;
            width: 100%;
            padding: 15px 0;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <header>
        <h1>Moto Gallery</h1>
        <p>Заплатите 100 рублей</p>
    </header>

    <div class="gallery-container">
        <div class="grid" id="gallery-grid">
            <!-- Сюда JavaScript автоматически добавит карточки с фото -->
        </div>
    </div>

    <footer>
        <p>&copy; сделано за 5 минут</p>
    </footer>

    <script>
        // Укажите расширение ваших картинок (jpg, png, jpeg и т.д.)
        const imageExtension = 'jpg'; 
        
        // Укажите, сколько всего у вас картинок (например, от 1 до 9)
        const totalImages = 9; 

        const grid = document.getElementById('gallery-grid');

        // Автоматически генерируем карточки для файлов 1, 2, 3...
        for (let i = 1; i <= totalImages; i++) {
            const card = document.createElement('div');
            card.className = 'card';

            // Путь к фото (так как они лежат в том же репозитории, пишем просто имя файла)
            const imagePath = `${i}.${imageExtension}`;

            card.innerHTML = `
                <div class="image-container">
                    <img src="${imagePath}" alt="Мотоцикл ${i}" loading="lazy" onerror="this.parentElement.style.display='flex'; this.parentElement.innerHTML='<span style=\'color:#666; display:flex; align-items:center; justify-content:center; height:100%; font-size:14px;\'>Фото ${i}.${imageExtension} не найдено</span>'">
                </div>
                <div class="card-info">
                    <h3>Мотоцикл #${i}</h3>
                </div>
            `;
            grid.appendChild(card);
        }
    </script>
</body>
</html>
